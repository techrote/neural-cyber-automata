name: Pinned host conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actual-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install pinned CPU package
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.45.1
          python -m pip install --no-build-isolation '.[export]'
      - name: Prepare and verify accepted game runtime
        run: python tools/host_setup.py --destination "$RUNNER_TEMP/nca-host" --github-env "$GITHUB_ENV"
      - name: Prepare and verify ACT-IK-001 joint-target runtime
        run: python tools/ik_host_setup.py --destination "$RUNNER_TEMP/nca-ik-host" --godot "$NCA_GODOT" --github-env "$GITHUB_ENV"
      - name: Require the actual host and export-owner lane
        run: |
          test -x "$NCA_GODOT"
          test -d "$NCA_HOST_CHECKOUT/.git"
          test -x "$NCA_IK_GODOT"
          test -d "$NCA_IK_HOST_CHECKOUT/.git"
          python - <<'PY'
          import sys
          import numpy

          assert numpy.__version__ == "2.3.5", "the export extra must provide pinned NumPy"
          sys.path.insert(0, "tests")
          from test_export_host import OWNER_ENABLED

          assert OWNER_ENABLED, "NumPy and pinned host paths must enable export-owner conformance"
          PY
      - name: Core and actual sampled/articulated host conformance
        run: python -m unittest discover -s tests -p "test_*.py" -v
