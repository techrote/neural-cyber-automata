name: Optional CPU learning conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  learning-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install pinned optional CPU learning runtime
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.45.1 numpy==2.3.5
          python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-build-isolation .
      - name: Require the declared CPU runtime
        run: python -c "import torch, numpy; assert torch.__version__ == '2.8.0+cpu'; assert numpy.__version__ == '2.3.5'; assert not torch.cuda.is_available()"
      - name: Learning contracts and tiny numerical fixtures
        run: python -m unittest discover -s tests -p "test_learning.py" -v
      - name: Validate predeclared experiment without running it
        run: python tools/first_skill.py prepare
