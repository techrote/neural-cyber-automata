name: 4LY experiment admission package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install pinned CPU admission runtime
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.45.1 numpy==2.3.5
          python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-build-isolation .
      - name: Run focused flight admission conformance
        run: python -m unittest discover -s tests -p "test_flight*.py" -v
      - name: Prepare exact-head admission candidate
        run: |
          mkdir -p "$RUNNER_TEMP/4ly004-admission"
          python tools/flight_admission.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/4ly004-admission" \
            | tee "$RUNNER_TEMP/4ly004-admission/summary.json"
      - name: Require custody/review to remain external
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "4ly004-admission"
          packet = json.loads((root / "admission-packet.json").read_text())
          assert packet["status"] == "READY_FOR_EXTERNAL_CUSTODY"
          assert packet["admitted"] is False
          assert packet["training_executed"] is False
          assert packet["final_access"] is False
          assert packet["reasons"] == ["learner_final_custody_missing"]
          PY
      - name: Retain review candidate
        uses: actions/upload-artifact@v4
        with:
          name: 4ly004-admission-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/4ly004-admission
          if-no-files-found: error
          retention-days: 30
