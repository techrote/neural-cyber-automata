name: T110 corrected formal reproduction

on:
  push:
    branches: [impl/t110-cellular]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-reproduction:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Prepare frozen learner checkout and CPU runtime
        run: |
          git worktree add --detach "$RUNNER_TEMP/t110-learner" 626099f98bf37f961c45796914b31926dc05f29d
          python -m venv "$RUNNER_TEMP/t110-venv"
          "$RUNNER_TEMP/t110-venv/bin/python" -m pip install setuptools==84.0.0 wheel==0.45.1 numpy==2.3.5
          "$RUNNER_TEMP/t110-venv/bin/python" -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Prepare pinned Cybersand and Godot runtime
        run: python tools/host_setup.py --destination "$RUNNER_TEMP/nca-host" --github-env "$GITHUB_ENV"
      - name: Execute the single corrected invocation
        shell: bash
        run: |
          CORRECTION_SHA="$(sha256sum configs/cellular/t110-launch-correction-20261019.json | awk '{print $1}')"
          python tools/cellular_reproduction_launch.py \
            --source-root "$RUNNER_TEMP/t110-learner" \
            --output "$RUNNER_TEMP/t110-evidence" \
            --python "$RUNNER_TEMP/t110-venv/bin/python" \
            --host "$NCA_HOST_CHECKOUT" \
            --godot "$NCA_GODOT" \
            --declaration "$GITHUB_WORKSPACE/configs/cellular/t110-reproduction-20261019.json" \
            --correction "$GITHUB_WORKSPACE/configs/cellular/t110-launch-correction-20261019.json" \
            --prior-budget "$GITHUB_WORKSPACE/configs/cellular/t110-reproduction-prior-budget-20261019.json" \
            --failed-receipt "$GITHUB_WORKSPACE/docs/evidence/t110-reproduction-import-failure-receipt.json" \
            --publication-commit "$GITHUB_SHA" \
            --expected-correction-sha256 "$CORRECTION_SHA"
      - name: Emit immutable summaries
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/t110-evidence/completion-receipt.json"; then
            echo '--- T110_COMPLETION_JSON_BEGIN ---'
            cat "$RUNNER_TEMP/t110-evidence/completion-receipt.json"
            echo '--- T110_COMPLETION_JSON_END ---'
          fi
          if test -f "$RUNNER_TEMP/t110-evidence/screen/summary.json"; then
            echo '--- T110_SUMMARY_JSON_BEGIN ---'
            cat "$RUNNER_TEMP/t110-evidence/screen/summary.json"
            echo '--- T110_SUMMARY_JSON_END ---'
          fi
      - name: Preserve complete corrected-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t110-corrected-reproduction-evidence
          path: ${{ runner.temp }}/t110-evidence
          if-no-files-found: warn
          retention-days: 90
